name: Release

# Push a tag like v1.0.0 to build signed APKs and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXTUBE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
            echo "NEXTUBE_KEYSTORE_FILE=release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key configured; APKs will be signed with the debug key."
          fi

      - name: Build release APKs
        env:
          NEXTUBE_KEYSTORE_PASSWORD: ${{ secrets.NEXTUBE_KEYSTORE_PASSWORD }}
          NEXTUBE_KEY_ALIAS: ${{ secrets.NEXTUBE_KEY_ALIAS }}
          NEXTUBE_KEY_PASSWORD: ${{ secrets.NEXTUBE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
